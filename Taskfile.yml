version: '3'

requires:
  vars:
    - DATASET # The path to the dataset available at https://doi.org/10.14459/2026mp1856124
    - RESULTS # Results (plots, etc.) are written to this folder
dotenv: [.env]

tasks:
  # --- Python utilities ---
  check-vars:
    internal: true
    requires:
      vars: [DATASET, RESULTS]
    preconditions:
      - sh: test -d '{{.DATASET}}'
        msg: 'DATASET folder "{{.DATASET}}" does not exist'
    cmds:
      - mkdir -p '{{.RESULTS}}'
    silent: true

  freeze-py-deps:
      desc: "Generate a standard human-readable requirements.txt"
      cmds:
        - |
          python -c "
          import matplotlib, pandas, scipy, tqdm
          print(f'matplotlib=={matplotlib.__version__}')
          print(f'pandas=={pandas.__version__}')
          print(f'scipy=={scipy.__version__}')
          print(f'tqdm=={tqdm.__version__}')
          " > requirements.txt
      silent: true

  # --- Counting data ---
  count-csvs:
    cmds:
      - |
        for DIR in '{{.DATASET}}'/*; do
          if [ -d "$DIR" ]; then
            printf "$(find "$DIR/" -name '*csv'  | wc -l)\t${DIR}\n";
          fi;
        done

  count-experiments:
    cmds:
      - |
        for DIR in '{{.DATASET}}'/*; do
          if [ -d "$DIR" ]; then
            printf "$(find "$DIR/" -name '*csv'  | wc -l)\t${DIR}\n";
            find "$DIR/" -iname '*csv' -execdir basename "{}" \; | sort | uniq -c
            echo ""
          fi;
        done | tee '{{.RESULTS}}/count-experiments.txt'

  # --- Figures ---

  sync:
    cmds:
      - rsync -Pr --copy-links * .* --exclude .venv --exclude .git --exclude *pdf --exclude .mypy_cache testbed-02:trace/git
      - rsync -P testbed-02:trace/git-results/*{pdf,txt} ../git-results/

  # Confirmed to work but computing CIs takes 4 min
  fig-02:
    desc: "Generate Figure 2."
    cmds:
      - task: check-vars
      # headdrop.pickle is needed by netns-drop figure
      - python3 figures/fig-02-headdrop.py '{{.DATASET}}'/multidurrate_1s/*multidurrate*/rate_{dl_500,ul_140}_1000.csv --pickle '{{.RESULTS}}/headdrop.pickle' -o '{{.RESULTS}}/fig-02.pdf'

  # TODO remove invalid burst sizes from the dataset?
  # TODO: output ist wrong!
